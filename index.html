<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri’s Shape Squad SMP - Season 3 Countdown</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-gold: #ffaa00; /* Server Gold */
            --accent-green: #55ff55; /* Admin Green */
            --text-color: #ffffff;
            --muted-text: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Animated Title Setup */
        .server-title {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #000000;
            display: inline-block;
        }

        .server-title span {
            display: inline-block;
            animation: serverColorCycle 8s linear infinite;
        }

        /* Smooth continuous cycle matching the image sequence */
        @keyframes serverColorCycle {
            0%, 100% { color: #ff5555; }  /* Red */
            25%      { color: #ffaa00; }  /* Gold/Orange */
            50%      { color: #ffff55; }  /* Yellow */
            75%      { color: #55ff55; }  /* Green */
        }

        /* Offsetting each word's animation to create a flowing gradient effect */
        .word-1 span { animation-delay: 0s; }
        .word-2 span { animation-delay: -1.5s; }
        .word-3 span { animation-delay: -3s; }
        .word-4 span { animation-delay: -4.5s; }

        h2 {
            color: var(--accent-green);
            font-size: 1.3rem;
            margin-top: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px #000000;
        }

        .countdown-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid var(--accent-gold);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 15px 10px;
            border-radius: 10px;
            min-width: 80px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--accent-green);
        }

        .time-number {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
            color: #ffffff;
        }

        .time-label {
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .info-text {
            font-size: 0.95rem;
            color: var(--muted-text);
            line-height: 1.5;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title text splits every word to let colors ripple sequentially -->
        <div class="server-title">
            <span class="word-1">Tri's</span> 
            &nbsp;
            <span class="word-2">Shape</span> 
            &nbsp;
            <span class="word-3">Squad</span> 
            &nbsp;
            <span class="word-4">SMP</span>
        </div>
        <h2>Season 3 Launch Countdown</h2>

        <div class="countdown-card">
            <div class="timer" id="launch-timer">
                <div class="time-box"><span class="time-number" id="days">00</span><span class="time-label">Days</span></div>
                <div class="time-box"><span class="time-number" id="hours">00</span><span class="time-label">Hours</span></div>
                <div class="time-box"><span class="time-number" id="mins">00</span><span class="time-label">Mins</span></div>
                <div class="time-box"><span class="time-number" id="secs">00</span><span class="time-label">Secs</span></div>
            </div>
            <div class="info-text">
                Get ready for the Discord Stage stream and a brand new year-long adventure!
            </div>
        </div>
    </div>

    <script>
        const launchTimestamp = 1785630600 * 1000; 

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = launchTimestamp - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('mins').innerText = "00";
                document.getElementById('secs').innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('mins').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('secs').innerText = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
