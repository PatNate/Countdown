<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tri’s Shape Squad SMP — Season 3 Countdown</title>

  <!-- Basic SEO / social preview -->
  <meta name="description" content="Countdown to Tri's Shape Squad SMP Season 3 launch — Discord Stage stream and year-long adventure!" />
  <meta property="og:title" content="Tri’s Shape Squad SMP — Season 3 Countdown" />
  <meta property="og:description" content="Countdown to Tri's Shape Squad SMP Season 3 launch" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#1a1a2e;
      --card:#16213e;
      --gold:#ffaa00;
      --green:#55ff55;
      --text:#fff;
      --muted:#b0b0b0;
      --accent-shadow: rgba(0,0,0,.6);
      --title-size: 2.4rem;
      --anim-duration: 8s;
    }

    /* Reset & layout */
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      width:100%;
      max-width:680px;
      text-align:center;
      padding:20px;
    }

    header h1{
      margin:0;
      font-size:var(--title-size);
      letter-spacing:1px;
      display:inline-block;
      text-shadow:2px 2px 0 #000;
    }

    /* Animated title: keep animation-hints low-impact and respect prefers-reduced-motion */
    .server-title{display:inline-flex; gap:.5ch; align-items:center}
    .server-title .word{
      display:inline-block;
      animation:colorCycle var(--anim-duration) linear infinite;
      will-change:color,opacity;
    }

    @keyframes colorCycle{
      0%,100%{color:#ff5555}
      25%{color:var(--gold)}
      50%{color:#ffff55}
      75%{color:var(--green)}
    }

    /* Stagger words (use nth-child for clarity) */
    .server-title .word:nth-child(1){animation-delay:0s}
    .server-title .word:nth-child(2){animation-delay:-1.5s}
    .server-title .word:nth-child(3){animation-delay:-3s}
    .server-title .word:nth-child(4){animation-delay:-4.5s}

    /* Respect user preference to reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .server-title .word,
      .server-title { animation: none !important; color: var(--gold) !important; }
    }

    h2{
      margin-top:8px;
      margin-bottom:22px;
      color:var(--green);
      font-size:1.05rem;
      text-transform:uppercase;
      letter-spacing:1.6px;
      text-shadow:1px 1px 0 #000;
    }

    .card{
      background:var(--card);
      border-radius:14px;
      padding:28px;
      box-shadow:0 10px 30px var(--accent-shadow);
      border:2px solid var(--gold);
    }

    .timer{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .time-box{
      background: rgba(0,0,0,.22);
      min-width:72px;
      padding:12px 10px;
      border-radius:10px;
      border-bottom:2px solid var(--green);
    }

    .time-number{
      font-size:2.1rem;
      font-weight:700;
      line-height:1;
      display:block;
      color:var(--text);
    }

    .time-label{
      display:block;
      margin-top:6px;
      font-size:.78rem;
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .info{
      color:var(--muted);
      font-size:.95rem;
      line-height:1.5;
      margin-top:12px;
    }

    /* Image styling */
    .banner-image{
      max-width:100%;
      margin-top:14px;
      border-radius:8px;
      border:2px solid var(--gold);
      display:block;
      margin-left:auto;
      margin-right:auto;
    }

    /* Responsiveness */
    @media (max-width:420px){
      .time-number{font-size:1.6rem}
      .time-box{min-width:60px;padding:10px}
      header h1{font-size:1.6rem}
    }
  </style>
</head>
<body>
  <main class="container">
    <header role="banner" aria-labelledby="page-title">
      <h1 id="page-title">
        <span class="server-title" aria-hidden="true">
          <span class="word">Tri's</span>
          <span class="word">Shape</span>
          <span class="word">Squad</span>
          <span class="word">SMP</span>
        </span>
        <span class="sr-only" style="position:absolute;left:-9999px;">Tri's Shape Squad SMP</span>
      </h1>
      <h2>Season 3 Countdown</h2>
    </header>

    <section class="card" aria-labelledby="countdown-heading">
     <!-- <h3 id="countdown-heading" class="sr-only">Countdown to Season 3</h3> -->

      <!-- Countdown boxes: visible numbers + aria-live for screen readers -->
      <div class="timer" id="launch-timer" aria-live="polite" aria-atomic="true">
        <div class="time-box" role="group" aria-label="Days remaining">
          <span class="time-number" id="days">00</span>
          <span class="time-label">Days</span>
        </div>
        <div class="time-box" role="group" aria-label="Hours remaining">
          <span class="time-number" id="hours">00</span>
          <span class="time-label">Hours</span>
        </div>
        <div class="time-box" role="group" aria-label="Minutes remaining">
          <span class="time-number" id="mins">00</span>
          <span class="time-label">Mins</span>
        </div>
        <div class="time-box" role="group" aria-label="Seconds remaining">
          <span class="time-number" id="secs">00</span>
          <span class="time-label">Secs</span>
        </div>
      </div>

      <!-- User-requested: display image.png under the timer -->
      <img src="image.png" alt="Season 1 spawn" class="banner-image" />

    </section>
  </main>

  <script>
    // ====== Configure your launch time here (ISO 8601 recommended) ======
    // Using local ISO (no timezone suffix) so the time is interpreted in the user's local timezone by the Date parser.
    // Requested: August 1st at 17:30 (year 2026)
    const LAUNCH_ISO = '2026-08-01T17:30:00';

    // Cache DOM elements for performance
    const elDays = document.getElementById('days');
    const elHours = document.getElementById('hours');
    const elMins = document.getElementById('mins');
    const elSecs = document.getElementById('secs');

    // Parse the launch time safely
    const launchDate = new Date(LAUNCH_ISO);
    if (isNaN(launchDate)) {
      // Fallback: if the configured date is invalid, show zeros and stop updates
      elDays.textContent = '00';
      elHours.textContent = '00';
      elMins.textContent = '00';
      elSecs.textContent = '00';
      console.error('Invalid LAUNCH_ISO:', LAUNCH_ISO);
    } else {
      function updateCountdown(){
        const now = Date.now();
        let diff = launchDate.getTime() - now;

        if (diff <= 0) {
          elDays.textContent = '00';
          elHours.textContent = '00';
          elMins.textContent = '00';
          elSecs.textContent = '00';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        diff -= days * (1000 * 60 * 60 * 24);
        const hours = Math.floor(diff / (1000 * 60 * 60));
        diff -= hours * (1000 * 60 * 60);
        const minutes = Math.floor(diff / (1000 * 60));
        diff -= minutes * (1000 * 60);
        const seconds = Math.floor(diff / 1000);

        elDays.textContent = String(days).padStart(2,'0');
        elHours.textContent = String(hours).padStart(2,'0');
        elMins.textContent = String(minutes).padStart(2,'0');
        elSecs.textContent = String(seconds).padStart(2,'0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
